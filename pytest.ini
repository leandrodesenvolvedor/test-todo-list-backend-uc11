[pytest]
# Onde o pytest deve procurar os testes.
#
# Sem esta linha, a ferramenta varre o projeto inteiro em busca de arquivos que
# comecem com `test_`. Funciona, mas é mais lento e pode encontrar coisas que
# não são teste — a pasta `venv/`, por exemplo, tem centenas de arquivos de
# teste das bibliotecas instaladas.
testpaths= tests 

# Os dois avisos abaixo vêm das bibliotecas, não deste projeto, e começaram a
# aparecer no Dia 7, quando o conftest.py passou a importar a aplicação inteira
# — a ponto de esconder o que importa na saída. Ficam silenciados aqui, com a
# justificativa registrada.
#
# A regra de conduta é essa: silenciar aviso **só** depois de descobrir de onde
# ele vem e por que não há o que corrigir, e deixar a justificativa escrita.
# Silenciar sem investigar é como apagar o alarme de incêndio sem olhar a casa.
#
# Nota: foi considerado usar `error` para transformar aviso novo em falha, que
# é uma boa prática em projeto de produção. Foi descartado de propósito: em
# laboratório, cada máquina tem um conjunto diferente de plugins do pytest
# instalados, e qualquer aviso de um deles quebraria a suíte do aluno por um
# motivo que não tem relação com o código dele.
filterwarnings =
 # FastAPI 0.115.6 + Pydantic 2.13.3: ao clonar os schemas usados em
 # `response_model`, o FastAPI aplica `Field()` sobre campos de tipo união
 # (por exemplo `prazo: date | None`). O aviso se reproduz com qualquer
 # modelo nessas condições, com ou sem `alias_generator`, e desaparece ao
 # atualizar o FastAPI. Não há o que corrigir no código da aplicação.
 ignore::pydantic.warnings.UnsupportedFieldAttributeWarning
 # Starlette usa `asyncio.iscoroutinefunction`, descontinuado no Python 3.14.
 ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning