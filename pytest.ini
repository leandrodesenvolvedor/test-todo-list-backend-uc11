[pytest]
# Onde o pytest deve procurar os testes.
#
# Sem esta linha, a ferramenta varre o projeto inteiro em busca de arquivos que
# comecem com `test_`. Funciona, mas é mais lento e pode encontrar coisas que
# não são teste — a pasta `venv/`, por exemplo, tem centenas de arquivos de
# teste das bibliotecas instaladas.
testpaths= tests 